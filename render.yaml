services:
  - type: web
    name: unisphere
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: UNISPHERE_SECRET
        generateValue: true
      - key: UNISPHERE_ADMIN_ID
        value: admin
      - key: UNISPHERE_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: unisphere-db
          property: connectionString
      - key: PYTHONUNBUFFERED
        value: "1"
databases:
  - name: unisphere-db
    plan: basic-256mb
    databaseName: unisphere
    user: unisphere
